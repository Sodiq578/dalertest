<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Ko'p turdagi kalendarlar</title>
  <style>
    * { box-sizing: border-box; font-family: Arial,sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background:#f0f4f8; padding:20px;}
    h2 { margin-top:30px; color:#111827; }
    
    .calendar, .inline-calendar, .datetime-picker {
      background:#fff; border-radius:16px; padding:20px; margin:20px 0; box-shadow:0 10px 20px rgba(0,0,0,0.1); width:350px;
    }

    .calendar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .calendar-header button { background:#667eea; color:#fff; border:none; border-radius:8px; padding:5px 10px; cursor:pointer; }
    .calendar-header h3 { margin:0; font-size:18px; color:#111827; }

    .weekdays, .days { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; }
    .weekdays div { font-weight:bold; color:#666; margin-bottom:5px; }
    .days div { padding:10px 0; margin:4px; border-radius:8px; cursor:pointer; transition:.3s; }
    .days div:hover { background:#667eea; color:#fff; }
    .today { background:#764ba2; color:#fff; font-weight:bold; }
    .selected { background:#34d399; color:#fff; font-weight:bold; }
    .empty { cursor:default; }
    .empty:hover { background:transparent; }

    label { display:block; margin-top:15px; margin-bottom:6px; font-weight:600; color:#374151; }
    input { width:100%; padding:12px; border-radius:10px; border:1px solid #d1d5db; font-size:16px; outline:none; }
    input:focus { border-color:#6366f1; box-shadow:0 0 0 2px rgba(99,102,241,0.3); }

    .result { margin-top:15px; padding:10px; background:#f3f4f6; border-radius:10px; text-align:center; font-weight:600; color:#111827; }
  </style>
</head>
<body>

  <!-- 1. Oddiy ril kalendar -->
  <h2>1. Ril Kalendar (Oy ko'rinadi)</h2>
  <div class="calendar" id="rilCalendar">
    <div class="calendar-header">
      <button id="prev1">&lt;</button>
      <h3 id="monthYear1"></h3>
      <button id="next1">&gt;</button>
    </div>
    <div class="weekdays">
      <div>Du</div><div>Se</div><div>Ch</div><div>Pa</div><div>Ju</div><div>Sh</div><div>Ya</div>
    </div>
    <div class="days" id="days1"></div>
  </div>

  <!-- 2. Sana va vaqt picker -->
  <h2>2. Sana & Vaqt Picker</h2>
  <div class="datetime-picker">
    <label>Sana tanlang</label>
    <input type="date" id="datePicker">
    <label>Vaqt tanlang</label>
    <input type="time" id="timePicker">
    <div class="result" id="resultPicker">Sana va vaqt tanlanmadi</div>
  </div>

  <!-- 3. Inline Kalendar -->
  <h2>3. Inline Kalendar (faqat sanani tanlash)</h2>
  <div class="inline-calendar" id="inlineCalendar">
    <div class="calendar-header">
      <button id="prev2">&lt;</button>
      <h3 id="monthYear2"></h3>
      <button id="next2">&gt;</button>
    </div>
    <div class="weekdays">
      <div>Du</div><div>Se</div><div>Ch</div><div>Pa</div><div>Ju</div><div>Sh</div><div>Ya</div>
    </div>
    <div class="days" id="days2"></div>
    <div class="result" id="selectedDate2">Hech narsa tanlanmadi</div>
  </div>

<script>
  // === 1. Ril Kalendar ===
  const days1 = document.getElementById("days1");
  const monthYear1 = document.getElementById("monthYear1");
  const prev1 = document.getElementById("prev1");
  const next1 = document.getElementById("next1");

  let today = new Date();
  let month1 = today.getMonth();
  let year1 = today.getFullYear();
  let selected1 = null;
  const months = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];

  function renderRilCalendar() {
    days1.innerHTML = "";
    monthYear1.textContent = months[month1]+" "+year1;
    const firstDay = new Date(year1,month1,1).getDay();
    const daysInMonth = new Date(year1,month1+1,0).getDate();
    for(let i=0;i<firstDay;i++){ const e = document.createElement("div"); e.classList.add("empty"); days1.appendChild(e);}
    for(let d=1;d<=daysInMonth;d++){
      const div = document.createElement("div"); div.textContent=d;
      if(d===today.getDate() && month1===today.getMonth() && year1===today.getFullYear()){ div.classList.add("today"); }
      if(selected1 && selected1.date===d && selected1.month===month1 && selected1.year===year1){ div.classList.add("selected"); }
      div.addEventListener("click",()=>{ selected1={date:d,month:month1,year:year1}; renderRilCalendar(); });
      days1.appendChild(div);
    }
  }

  prev1.addEventListener("click",()=>{ month1--; if(month1<0){month1=11; year1--;} renderRilCalendar(); });
  next1.addEventListener("click",()=>{ month1++; if(month1>11){month1=0; year1++;} renderRilCalendar(); });

  renderRilCalendar();

  // === 2. Sana va vaqt picker ===
  const datePicker = document.getElementById("datePicker");
  const timePicker = document.getElementById("timePicker");
  const resultPicker = document.getElementById("resultPicker");

  datePicker.addEventListener("input", updatePicker);
  timePicker.addEventListener("input", updatePicker);

  function updatePicker(){
    const d = datePicker.value;
    const t = timePicker.value;
    if(d && t){ resultPicker.textContent=`Tanlangan sana: ${d} | Vaqt: ${t}`; }
    else{ resultPicker.textContent="Sana va vaqt tanlanmadi"; }
  }

  // === 3. Inline Kalendar ===
  const days2 = document.getElementById("days2");
  const monthYear2 = document.getElementById("monthYear2");
  const prev2 = document.getElementById("prev2");
  const next2 = document.getElementById("next2");
  const selectedDate2 = document.getElementById("selectedDate2");

  let month2 = today.getMonth();
  let year2 = today.getFullYear();
  let selected2 = null;

  function renderInlineCalendar(){
    days2.innerHTML = "";
    monthYear2.textContent = months[month2]+" "+year2;
    const firstDay = new Date(year2,month2,1).getDay();
    const daysInMonth = new Date(year2,month2+1,0).getDate();
    for(let i=0;i<firstDay;i++){ const e = document.createElement("div"); e.classList.add("empty"); days2.appendChild(e);}
    for(let d=1;d<=daysInMonth;d++){
      const div = document.createElement("div"); div.textContent=d;
      if(d===today.getDate() && month2===today.getMonth() && year2===today.getFullYear()){ div.classList.add("today"); }
      if(selected2 && selected2.date===d && selected2.month===month2 && selected2.year===year2){ div.classList.add("selected"); }
      div.addEventListener("click",()=>{
        selected2={date:d,month:month2,year:year2};
        selectedDate2.textContent = `Tanlangan sana: ${selected2.date}/${selected2.month+1}/${selected2.year}`;
        renderInlineCalendar();
      });
      days2.appendChild(div);
    }
  }

  prev2.addEventListener("click",()=>{ month2--; if(month2<0){month2=11; year2--;} renderInlineCalendar(); });
  next2.addEventListener("click",()=>{ month2++; if(month2>11){month2=0; year2++;} renderInlineCalendar(); });

  renderInlineCalendar();

</script>
</body>
</html>
