<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Date & Time Calendar</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
    }

    .calendar-box {
      width: 340px;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #111827;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
    }

    .result {
      margin-top: 20px;
      padding: 14px;
      background: #f3f4f6;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      color: #111827;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>

  <div class="calendar-box">
    <h2>Kalendar (Date & Time)</h2>

    <label>Sana tanlang</label>
    <input type="date" id="date">

    <label>Vaqt tanlang</label>
    <input type="time" id="time">

    <button onclick="showResult()">Ko‘rsatish</button>

    <div class="result" id="result">
      Sana va vaqt tanlanmadi
    </div>
  </div>

  <script>
    function showResult() {
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const result = document.getElementById("result");

      if (!date || !time) {
        result.textContent = "Iltimos sana va vaqtni tanlang";
        return;
      }

      result.textContent = `Tanlangan sana: ${date} | Vaqt: ${time}`;
    }
  </script>

</body>
</html>
